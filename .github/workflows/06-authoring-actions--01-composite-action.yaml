name: Composite Action Demo
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Name of the person"
        required: true
        default: "2"

jobs:
  hello-world-1:
    runs-on: ubuntu-24.04
    name: One usage of the composite action
    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0
      - id: composite-action-instance
        uses: ./06-authoring-actions/composite-action
        with:
          who-to-greet: "from composite action in hello-world-1!"
      - env:
          RANDOM_NUMBER: ${{ steps.composite-action-instance.outputs.random-number }}
        run: echo random-number "$RANDOM_NUMBER"
        shell: bash
  hello-world-2:
    runs-on: ubuntu-24.04
    name: Another usage of the composite action
    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0
      - id: composite-action-instance
        uses: ./06-authoring-actions/composite-action
        with:
          who-to-greet: "from composite action in hello-world-2!"
      - env:
          RANDOM_NUMBER: ${{ steps.composite-action-instance.outputs.random-number }}
        run: echo random-number "$RANDOM_NUMBER"
        shell: bash
  
  greet-name:
    runs-on: ubuntu-24.04
    name: Greeting the User
    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 
      
      - id: composite-greet
        uses: ./06-authoring-actions/greeting-action
        with:
          person-name: ${{ github.event.inputs.name }}
      
      - env:
          GREETING: ${{ steps.composite-greet.outputs.greeting }}
        run: echo greeting '$Greeting'
        shell: bash
